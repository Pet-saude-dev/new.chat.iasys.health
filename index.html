<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="image/favicon/favicon.ico" type="image/x-icon" />
    <title>IASYS</title>
  </head>
  <body>
    <div id="chat-page">

      <aside id="sidebar">
        <div id="sidebar-logo">
          <img src="image/robo.png" alt="IASYS" id="sidebar-logo-img" onerror="this.style.display='none'" />
        </div>
        <nav id="sidebar-nav">
          <button class="agent-btn" data-agent="1" title="Orientações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Orientações</span>
          </button>
          <button class="agent-btn" data-agent="2" title="Agendamentos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Agendamentos</span>
          </button>
          <button class="agent-btn" data-agent="3" title="Histórico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Histórico</span>
          </button>
          <button class="agent-btn" data-agent="4" title="Notificações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>Notificações</span>
          </button>
        </nav>
        <div id="sidebar-footer">
          <div id="sidebar-secure">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
        </div>
      </aside>

      <div id="drawer-overlay" onclick="closeDrawer()">
        <div id="drawer-panel" onclick="event.stopPropagation()">
          <div id="drawer-header">
            <div id="drawer-logo">
              <img src="image/robo.png" alt="IASYS" onerror="this.style.display='none'" />
            </div>
            <span id="drawer-brand">IASYS · PET Saúde Digital</span>
            <button id="drawer-close-btn" onclick="closeDrawer()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div id="drawer-label">Seções</div>
          <nav id="drawer-nav">
            <button class="drawer-item agent-btn" data-agent="1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Orientações
            </button>
            <button class="drawer-item agent-btn" data-agent="2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Agendamentos
            </button>
            <button class="drawer-item agent-btn" data-agent="3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Histórico
            </button>
            <button class="drawer-item agent-btn" data-agent="4">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              Notificações
            </button>
          </nav>
          <div id="drawer-footer-secure">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Conexão segura · PET Saúde Digital · Petrolina
          </div>
        </div>
      </div>

      <div id="main-area">

        <div id="mobile-header">
          <button id="menu-btn" onclick="openDrawer()" aria-label="Abrir menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div id="mobile-header-info">
            <div id="chat-title">Carregando...</div>
            <div id="chat-sub">IASYS · PET Saúde Digital</div>
          </div>
          <div id="chat-status-dot"></div>
        </div>

        <div id="home-screen">
          <div id="home-logo">
            <img src="image/robo.png" alt="IASYS" onerror="this.style.display='none'" />
          </div>
          <div id="home-greeting">Olá! No que posso<br>te ajudar hoje?</div>
          <div id="home-quick">
            <button class="home-quick-btn" data-msg="Quero informar um problema de saúde">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              <div>
                <div class="hq-label">Informar um problema de saúde</div>
                <div class="hq-sub">Sintomas, dores e mal-estar</div>
              </div>
            </button>
            <button class="home-quick-btn" data-msg="Quero agendar ou confirmar uma consulta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <div>
                <div class="hq-label">Agendar ou confirmar consulta</div>
                <div class="hq-sub">Consultas e procedimentos</div>
              </div>
            </button>
            <button class="home-quick-btn" data-msg="Preciso de orientações rápidas de saúde">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <div>
                <div class="hq-label">Orientações rápidas</div>
                <div class="hq-sub">Dúvidas e informações de saúde</div>
              </div>
            </button>
          </div>
          <div id="home-input-wrap">
            <div id="home-input-pill">
              <input type="text" id="home-input" placeholder="Peça ao assistente de saúde..." autocomplete="off" />
              <button id="home-send-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div id="chat-area" class="hidden">
          <div id="chat-messages"></div>
          <form id="message-form">
            <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off" required />
            <button type="submit" id="send-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
          <div id="footer-bar">
            <span id="footer-brand">PET Saúde Digital · Petrolina</span>
            <span id="footer-secure">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Conexão segura
            </span>
          </div>
        </div>

      </div>
    </div>

    <script src="app.js"></script>
    <script>
      function openDrawer() {
        document.getElementById('drawer-overlay').classList.add('open');
      }
      function closeDrawer() {
        document.getElementById('drawer-overlay').classList.remove('open');
      }

      document.querySelectorAll('.home-quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const msg = btn.dataset.msg;
          enterChat(msg);
        });
      });

      function enterChat(prefillMsg) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('chat-area').classList.remove('hidden');
        if (prefillMsg) {
          const input = document.getElementById('message-input');
          input.value = prefillMsg;
          document.getElementById('message-form').requestSubmit();
        }
      }

      document.getElementById('home-send-btn').addEventListener('click', () => {
        const val = document.getElementById('home-input').value.trim();
        if (val) enterChat(val);
      });

      document.getElementById('home-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const val = e.target.value.trim();
          if (val) enterChat(val);
        }
      });
    </script>
  </body>
</html>
