<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>IASYS</title>
  </head>
  <body>
    <div id="chat-page">

      <div id="chat-header">
        <div id="logo-circle">
          <img src="image/robo.png" alt="IASYS" id="logo-img" onerror="this.style.display='none'" />
        </div>
        <div id="chat-header-info">
          <div id="chat-title">Carregando...</div>
          <div id="chat-sub">IASYS · PET Saúde Digital</div>
        </div>
        <div id="chat-status-dot"></div>
      </div>

      <!-- Botões de troca de agente -->
      <div id="agent-selector">
        <button class="agent-btn" data-agent="1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Orientações
        </button>
        <button class="agent-btn" data-agent="2">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Agendamentos
        </button>
        <button class="agent-btn" data-agent="3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Histórico
        </button>
        <button class="agent-btn" data-agent="4">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notificações
        </button>
      </div>

      <div id="chat-messages"></div>

      <form id="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>

      <div id="footer-bar">
        <span id="footer-brand">PET Saúde Digital · Petrolina</span>
        <span id="footer-secure">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="10" height="10">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Conexão segura
        </span>
      </div>

    </div>
    <script src="app.js"></script>
  </body>
</html>
